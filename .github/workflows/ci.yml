name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dsh-mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dsh-mobile/package-lock.json

      - name: Install
        run: npm ci

      - name: Rebuild Pocket assets and check they are committed
        run: |
          node ../scripts/build-app.mjs ..
          git diff --exit-code -- ../dsh-mobile/assets/pocket

      - name: Syntax check app shell
        run: |
          node --check ../app/app.js
          node --check ../app/api.js
          node --check ../app/timeline.js
          node --check ../app/cache.js
          node --check ../app/prefs.js
          node --check ../app/update.js

      - name: Validate PWA manifest
        run: node -e "JSON.parse(require('fs').readFileSync('../app/manifest.webmanifest','utf8'))"

      - name: App transport, timeline, offline, preference and update tests
        working-directory: .
        run: >
          node --test --test-isolation=none --test-force-exit
          tests/app/api.test.mjs
          tests/app/timeline.test.mjs
          tests/app/cache.test.mjs
          tests/app/prefs.test.mjs
          tests/app/update.test.mjs

      - name: Gateway tests
        run: >
          node --test --test-isolation=none --test-force-exit
          tests/gateway.test.mjs
          tests/plugin.test.mjs
          tests/net.test.mjs
          tests/store.test.mjs
          tests/tunnel.test.mjs
          tests/tsnet.test.mjs
          tests/notify.test.mjs
          tests/upstream-retry.test.mjs