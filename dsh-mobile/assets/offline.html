<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#111418" />
    <title>暂时离线 · DSH 手机端</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: #111418;
        color: #e8eaed;
        font: 16px/1.7 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 28px;
      }
      .card {
        width: min(420px, 100%);
        background: #1c2128;
        border: 1px solid #2b333d;
        border-radius: 20px;
        padding: 30px 24px;
        text-align: center;
      }
      .mark {
        width: 56px;
        height: 56px;
        margin: 0 auto 18px;
        border-radius: 16px;
        background: #4d6bfe;
        display: grid;
        place-items: center;
        font-weight: 700;
        font-size: 24px;
        color: #fff;
      }
      h1 { font-size: 19px; margin: 0 0 10px; }
      p { margin: 0 0 8px; color: #aab2bd; font-size: 14px; }
      button {
        margin-top: 18px;
        width: 100%;
        border: 0;
        border-radius: 12px;
        padding: 12px 16px;
        font: inherit;
        font-weight: 600;
        color: #fff;
        background: #4d6bfe;
      }
      .hint { margin-top: 14px; font-size: 12px; color: #6f7a87; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark">D</div>
      <h1>暂时连不上电脑</h1>
      <p>请确认电脑上的 DSH 正在运行，并且手机和电脑网络通畅。</p>
      <p>如果你用的是公网域名，也检查一下隧道进程是否还在。</p>
      <button type="button" onclick="location.reload()">重新连接</button>
      <p class="hint" id="hint">DSH 手机端 · 会话与数据都保存在你自己的电脑上</p>
    </div>
    <script>
      // 电脑恢复后自动回到 App，不用手动点。
      (function () {
        var tries = 0;
        var hint = document.getElementById('hint');
        function retry() {
          if (tries >= 12) return;
          tries += 1;
          if (navigator.onLine === false) return;
          fetch(location.origin + '/__dshm/health', { cache: 'no-store' })
            .then(function (res) {
              if (res.ok) location.replace('/');
            })
            .catch(function () {
              if (tries === 3 && hint) hint.textContent = '正在自动重试…连上电脑后会自动进入';
            });
        }
        setInterval(retry, 5000);
        setTimeout(retry, 1000);
      })();
    </script>
  </body>
</html>
